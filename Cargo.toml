[package]
name = "recent-spaces"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Keep the Herdr spaces sidebar in most-recently-used order"
repository = "https://github.com/mike-bronner/herdr-plugin-recent-spaces"

[lib]
name = "recent_spaces"
path = "src/lib.rs"

[[bin]]
name = "watch"
path = "src/main.rs"

# No `rust-version`, deliberately. The 1.75 this used to declare was already
# false twice over: the kit's generated types need `LazyLock` from 1.80, and
# `regress`, which the kit pulls in normally, declares `edition = "2024"` and so
# needs 1.85. The second is what binds. A floor is a promise to people who
# compile this, and nobody has to: the plugin installs a published binary. See
# herdr-plugin-kit SCOPE.md section 11.8.1.
[dependencies]
herdr-plugin-kit = { git = "https://github.com/mike-bronner/herdr-plugin-kit", tag = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
toml = "0.8"

# Build-only, and it must stay that way. The stamp helper runs once during the
# build and belongs in no shipped binary, which is why the kit ships it as a
# second crate that depends on nothing.
[build-dependencies]
herdr-plugin-kit-build = { git = "https://github.com/mike-bronner/herdr-plugin-kit", tag = "0.2.0" }

[profile.release]
opt-level = "s"
strip = true
