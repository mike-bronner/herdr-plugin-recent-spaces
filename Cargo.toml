[package]
name = "recent-spaces"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Keep the Herdr spaces sidebar in most-recently-used order"
repository = "https://github.com/mike-bronner/herdr-plugin-recent-spaces"

[lib]
name = "recent_spaces"
path = "src/lib.rs"

[[bin]]
name = "watch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "s"
strip = true
