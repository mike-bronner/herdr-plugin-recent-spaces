name: CI

# A caller, and nothing more. Every gate lives in herdr-plugin-kit's reusable
# workflow, pinned at the same tag Cargo.toml pins the crate to, so bumping one
# ref moves every plugin's checks together.
#
# What it runs: the shims still match the kit's templates, the versions and the
# tag form agree, then the suite, the formatting and clippy with warnings
# denied, then all six release targets compile.
#
# 🪤 Both triggers. When a pull request cannot compute a merge ref against main,
# Actions skips its pull_request workflows entirely — no run, no error, and the
# checks never appear. The push trigger keeps a conflicted branch covered.

on:
  push:
  pull_request:

jobs:
  checks:
    # macOS is not a preference. The suite writes its temporary directories
    # under /private/tmp, which exists on macOS and not on Linux, so a Linux
    # runner cannot run this suite at all.
    #
    # 🔑 It is the only input, and the only one there is. A crate name, a binary
    # name or a toolchain version would each repeat a fact the manifests already
    # state, and an input that disagrees with a manifest publishes one asset
    # name while every install requests another.
    uses: mike-bronner/herdr-plugin-kit/.github/workflows/plugin-ci.yml@0.1.0
    with:
      test_os: macos-latest
