name: Release

# Publishes a watcher binary, and its checksum, for every platform the manifest
# claims. `herdr plugin install` reads no release metadata at all — it fetches a
# git ref and runs the build step — so these assets are reached by the URL that
# bin/build composes from the version in herdr-plugin.toml. The tag therefore has
# to be `v<that version>`, which is this repo's convention already.
#
# Nothing here runs on a push. Assets exist per release, and the binary is only
# worth publishing for a version somebody can install.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build binaries for'
        required: true

jobs:
  # Nothing is published until the tree being published passes the same three
  # gates CI runs. A published asset is what users download, and it cannot be
  # recalled once somebody has it.
  #
  # The checkout takes the same ref the binaries take. A gate that tested the
  # default branch while the assets came from a tag would pass for a tree nobody
  # is publishing, which is worse than no gate: it would report green over red.
  gates:
    name: Suite, formatting and clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run the suite
        run: cargo test

      - name: Check the formatting
        run: cargo fmt --check

      - name: Check clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings

  binaries:
    name: ${{ matrix.target }}
    needs: gates
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Two runners cover four platforms. Apple Silicon cross-compiles to
        # Intel with the SDKs Xcode already ships, and cargo-zigbuild links both
        # Linux targets from one x86_64 runner. That keeps the matrix off runner
        # labels that come and go.
        #
        # Linux is musl on purpose: the crate has no C dependencies, so a static
        # binary costs nothing and runs on glibc and musl alike. A glibc build
        # would refuse to start on any distribution older than the runner.
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2.87.6
        with:
          tool: cargo-zigbuild

      - name: Build the watcher
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --target "$TARGET"
          else
            cargo build --release --target "$TARGET"
          fi

      - name: Name it the one way the shim will look for it
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # bin/asset-name is the only place that maps a platform to an asset
          # name, and bin/build asks it the same question on the installing
          # machine. Spelling a name out here instead is how the two drift.
          ASSET="$(sh bin/asset-name "$TARGET")"
          cp "target/$TARGET/release/watch" "$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish the binary and the checksum together
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
